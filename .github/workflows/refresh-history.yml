name: Refresh price history

on:
  schedule:
    # 22:00 UTC, Mon-Fri - after the US market close (16:00 ET) with margin
    # for both EST and EDT.
    - cron: "0 22 * * 1-5"
    # Extra passes the next morning, Tue-Sat. Right after the close Yahoo often
    # returns the last trade instead of the official close (on 2026-11-04 the
    # night run stored MSFT 517.01 instead of 520.99), and GitHub starts
    # scheduled runs hours late, so several morning passes overwrite the
    # preliminary closes well before the next session opens.
    - cron: "0 4 * * 2-6"
    - cron: "0 7 * * 2-6"
    - cron: "0 10 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance

      - name: Refresh history.db
        run: python3 fetch_history.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- history.db; then
            echo "No changes to history.db"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.db
          git commit -m "Refresh history.db ($(date -u +%Y-%m-%d))"
          git push
